<title>Khulasah Islam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="คลังสรุปแปลหนังสืออิสลามจากภาษาอาหรับเป็นภาษาไทยและมลายูยาวี">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Serif+Thai:wght@600;700&display=swap">
<style>
/* Layout: a library shelf. Lapis header band, filter rail of categories, grid of "kitab covers" whose face is the Arabic title; reading page is a single 68ch column with a contents list. */
:root {
  --paper: #f4f6f5;
  --surface: #ffffff;
  --ink: #18242e;
  --muted: #5b6b74;
  --line: #d9e0df;
  --lapis: #1f3d5a;
  --lapis-ink: #f1f5f8;
  --gold: #a87422;
  --gold-soft: #f3e7cf;
  --cover-1: #24496a; --cover-2: #2f5d4f; --cover-3: #6a3b3b; --cover-4: #4b456e; --cover-5: #5d5230; --cover-6: #335f6e;
  --font-ar: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
  --font-jawi: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif;
  --font-th: "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --font-th-display: "Noto Serif Thai", "Noto Sans Thai", serif;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111a20; --surface: #18232b; --ink: #e5ecef; --muted: #9aabb4; --line: #2a3943;
  --lapis: #142a3d; --lapis-ink: #e9f0f5; --gold: #d9a54e; --gold-soft: #3a2f1c; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #111a20; --surface: #18232b; --ink: #e5ecef; --muted: #9aabb4; --line: #2a3943;
  --lapis: #142a3d; --lapis-ink: #e9f0f5; --gold: #d9a54e; --gold-soft: #3a2f1c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-th); font-size: 16px; line-height: 1.7; }
body.ms { font-family: var(--font-jawi); font-size: 18px; line-height: 2; }
.ar { font-family: var(--font-ar); }
.jawi { font-family: var(--font-jawi); }
.th { font-family: var(--font-th); }
a { color: var(--gold); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.masthead { background: var(--lapis); color: var(--lapis-ink); margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); }
.masthead .wrap { padding-block: 20px 28px; display: grid; gap: 18px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; text-decoration: none; color: inherit; flex-wrap: wrap; }
.brand .ar { font-size: 2rem; line-height: 1; font-weight: 700; }
.brand .latin { font-family: var(--font-th); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.langswitch { display: inline-flex; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 3px; gap: 2px; }
.langswitch button { background: transparent; border: 0; border-radius: 999px; padding: 4px 14px; cursor: pointer; color: var(--lapis-ink); font-size: .9rem; line-height: 1.6; }
.langswitch button[aria-pressed="true"] { background: var(--lapis-ink); color: var(--lapis); font-weight: 700; }
.langswitch .jawi { font-size: 1rem; }
.tagline { margin: 0; max-width: 62ch; font-size: 1.02rem; opacity: .92; text-wrap: balance; }
.search { display: flex; }
.search input { width: 100%; max-width: 520px; border: 0; border-radius: var(--radius); padding: 10px 14px; background: var(--surface); color: var(--ink); }

/* catalog */
main { padding-block: 28px 56px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; cursor: pointer; font-size: .92rem; display: inline-flex; gap: 8px; align-items: center; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .82rem; font-family: var(--font-th); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.count { color: var(--muted); font-size: .9rem; margin: 0 0 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
.book { display: grid; grid-template-rows: auto 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; text-decoration: none; color: inherit; transition: transform .15s ease, box-shadow .15s ease; }
.book:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
.cover { position: relative; aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; padding: 18px; color: #f6efe0; text-align: center; background: var(--c, var(--cover-1)); }
.cover::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(246,239,224,.45); border-radius: 3px; pointer-events: none; }
.cover::after { content: ""; position: absolute; inset: 14px; border: 1px solid rgba(246,239,224,.2); border-radius: 2px; pointer-events: none; }
.cover .ar { font-size: 1.7rem; line-height: 1.5; font-weight: 700; text-wrap: balance; }
.badge { position: absolute; top: 18px; inset-inline-start: 18px; background: var(--gold-soft); color: var(--gold); border-radius: 3px; padding: 0 8px; font-size: .72rem; font-weight: 700; letter-spacing: .04em; font-family: var(--font-th); }
body.ms .badge { font-family: var(--font-jawi); font-size: .8rem; }
.meta { padding: 14px 16px 16px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.meta .t { font-weight: 700; line-height: 1.45; }
body:not(.ms) .meta .t { font-family: var(--font-th-display); }
.meta .a { color: var(--muted); font-size: .9rem; }
.meta .cat { font-size: .78rem; color: var(--gold); font-weight: 700; letter-spacing: .03em; }
.empty { padding: 40px 0; color: var(--muted); }

.about { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
.about h2 { font-size: 1.05rem; margin: 0 0 6px; }
.about p { margin: 0; color: var(--muted); font-size: .95rem; }

/* reader */
.reader { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 40px; align-items: start; }
.panel.dl-inline { display: none; margin-bottom: 22px; }
@media (max-width: 820px) { .reader { grid-template-columns: minmax(0, 1fr); } .side { position: static; } .side .dl-panel { display: none; } .panel.dl-inline { display: grid; } }
.back { display: inline-block; margin-bottom: 18px; text-decoration: none; font-size: .95rem; }
.titleblock { display: grid; gap: 6px; margin-bottom: 22px; }
.titleblock > .ar { font-size: 2.3rem; line-height: 1.5; font-weight: 700; color: var(--ink); }
.titleblock h1 { margin: 0; font-size: 1.5rem; line-height: 1.4; text-wrap: balance; }
body:not(.ms) .titleblock h1 { font-family: var(--font-th-display); }
.titleblock .by { color: var(--muted); }
.notice { background: var(--gold-soft); color: var(--ink); border-radius: var(--radius); padding: 10px 14px; font-size: .93rem; margin-bottom: 22px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.tabs button { border: 0; background: none; padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); font-weight: 700; }
.tabs .jawi { font-size: 1.05rem; }
.summary { max-width: 68ch; }
.summary h2 { font-size: 1.2rem; margin: 1.6em 0 .4em; }
.summary[dir="rtl"] { font-family: var(--font-jawi); font-size: 1.15rem; line-height: 2.1; }
.summary[lang="th"] { font-family: var(--font-th); }
.summary blockquote { margin: 1em 0; padding: 8px 14px; border-inline-start: 3px solid var(--gold); background: var(--surface); }
.summary ul, .summary ol { padding-inline-start: 1.4em; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; }
.panel h3 { margin: 0; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
body.ms .panel h3 { letter-spacing: 0; text-transform: none; font-size: .95rem; }
.dl { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none; background: var(--lapis); color: var(--lapis-ink); border-radius: var(--radius); padding: 9px 12px; font-size: .95rem; }
.dl small { opacity: .75; font-family: var(--font-th); }
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .93rem; }
.toc a { color: var(--ink); text-decoration: none; }
.toc a:hover { color: var(--gold); }
dl.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .9rem; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; min-width: 0; }

footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
footer .wrap { padding-block: 20px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) { .book { transition: none; } .book:hover { transform: none; } }
@media print {
  .masthead .search, .langswitch, .side, .back, .tabs, footer { display: none !important; }
  .reader { display: block; }
  body { background: #fff; color: #000; }
}
</style>

<header class="masthead">
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="#home"><span class="ar" dir="rtl" lang="ar">خلاصة إسلام</span><span class="latin">Khulasah Islam</span></a>
      <div class="langswitch" role="group" aria-label="Language">
        <button type="button" id="ui-th" data-lang="th" class="th">ไทย</button>
        <button type="button" id="ui-ms" data-lang="ms" class="jawi" lang="ms-Arab">جاوي</button>
      </div>
    </div>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="search"><input id="q" type="search" autocomplete="off" data-i18n-ph="search"></div>
  </div>
</header>

<main class="wrap" id="view"></main>

<footer><div class="wrap"><span data-i18n="footer"></span><span>Khulasah Islam · <span id="nbooks"></span></span></div></footer>

<script id="khulasah-data" type="application/json">/*__DATA__*/</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('khulasah-data').textContent);
  const BOOKS = DATA.books, CATS = DATA.categories;
  const COVERS = { aqidah: 'var(--cover-4)', fiqh: 'var(--cover-2)', hadith: 'var(--cover-1)', tasawwuf: 'var(--cover-3)', nahw: 'var(--cover-5)', sirah: 'var(--cover-6)' };

  const T = {
    th: {
      tagline: 'คลังสรุปแปลหนังสืออิสลามจากภาษาอาหรับ เป็นภาษาไทยและภาษามลายูอักษรยาวี อ่านออนไลน์และดาวน์โหลดได้ฟรี',
      search: 'ค้นหาชื่อหนังสือ ผู้แต่ง หรือชื่อภาษาอาหรับ',
      all: 'ทั้งหมด', count: n => `${n} เล่ม`, sample: 'ตัวอย่าง', none: 'ไม่พบหนังสือที่ค้นหา',
      back: '← กลับไปคลังหนังสือ', by: 'ผู้แต่ง', summarizer: 'ผู้สรุปแปล', category: 'หมวด', added: 'เพิ่มเมื่อ',
      download: 'ดาวน์โหลด PDF', contents: 'สารบัญ', info: 'ข้อมูลหนังสือ', read: 'อ่านสรุปเป็นภาษา',
      sampleNote: 'รายการนี้เป็นตัวอย่างเพื่อแสดงหน้าตาเว็บไซต์ เนื้อหาสรุปยังไม่ใช่ฉบับจริง ผู้ดูแลจะแทนที่ด้วยสรุปแปลที่ตรวจทานแล้ว',
      about1h: 'เกี่ยวกับคลังนี้', about1: 'รวบรวมสรุปแปลกิตาบภาษาอาหรับ เพื่อให้ผู้อ่านทั่วไปเข้าถึงเนื้อหาสำคัญได้ง่ายขึ้น ทุกเล่มระบุชื่อต้นฉบับและผู้แต่ง',
      about2h: 'อ่านได้สองภาษา', about2: 'แต่ละเล่มมีสรุปเป็นภาษาไทยและภาษามลายูอักษรยาวี สลับภาษาได้ในหน้าอ่าน',
      about3h: 'ดาวน์โหลดฟรี', about3: 'ทุกเล่มมีไฟล์ PDF ให้ดาวน์โหลดไปอ่านแบบออฟไลน์หรือพิมพ์แจกจ่ายได้',
      footer: 'สรุปแปลเพื่อการศึกษา โปรดศึกษาจากต้นฉบับและครูผู้รู้ประกอบ',
      lang_th: 'ไทย', lang_ms: 'ยาวี'
    },
    ms: {
      tagline: 'ڤوست ريڠکسن ترجمهن کيتاب٢ اسلام درڤد بهاس عرب کڤد بهاس تاي دان بهاس ملايو توليسن جاوي. باچ دالم تالين دان موات تورون دڠن ڤرچوما.',
      search: 'چاري نام کيتاب، ڤڠارڠ اتاو تاجوق عرب',
      all: 'سموا', count: n => `${n} بواه کيتاب`, sample: 'چونتوه', none: 'تيادا کيتاب دجومڤاٴي',
      back: '→ کمبالي ک ڤرڤوستاکاٴن', by: 'ڤڠارڠ', summarizer: 'ڤڽوسون ريڠکسن', category: 'کاتݢوري', added: 'تاريخ دتمبه',
      download: 'موات تورون PDF', contents: 'کندوڠن', info: 'معلومت کيتاب', read: 'باچ ريڠکسن دالم بهاس',
      sampleNote: 'اين چونتوه سهاج اونتوق منونجوقکن روڤا لامن. ايسي ريڠکسن بلوم لاݢي ناسخه سبنر.',
      about1h: 'تنتڠ ڤرڤوستاکاٴن اين', about1: 'مڠومڤولکن ريڠکسن ترجمهن کيتاب عرب سوڤايا ڤمباچ عموم لبيه موده ممهمي ايسيڽ. ستياڤ کيتاب منيبوتکن نام اصل دان ڤڠارڠڽ.',
      about2h: 'دوا بهاس', about2: 'ستياڤ کيتاب ممڤوڽاٴي ريڠکسن دالم بهاس تاي دان بهاس ملايو جاوي.',
      about3h: 'موات تورون ڤرچوما', about3: 'ستياڤ کيتاب اد فايل PDF اونتوق دباچ تنڤا اينترنيت اتاو دچيتق.',
      footer: 'ريڠکسن اونتوق تجوان ڤنديديقن. سيلا رجوع کيتاب اصل دان ݢورو يڠ عالم.',
      lang_th: 'تاي', lang_ms: 'جاوي'
    }
  };

  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  let ui = store.get('khulasah-ui') === 'ms' ? 'ms' : 'th';
  let cat = 'all', q = '', readLang = null;

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const t = k => T[ui][k];
  const catName = id => (CATS.find(c => c.id === id) || {})[ui] || id;
  const title = b => ui === 'ms' ? b.title_ms : b.title_th;
  const author = b => ui === 'ms' ? b.author_ms : b.author_th;

  function applyUI() {
    document.documentElement.lang = ui === 'ms' ? 'ms-Arab' : 'th';
    document.documentElement.dir = ui === 'ms' ? 'rtl' : 'ltr';
    document.body.classList.toggle('ms', ui === 'ms');
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
    document.querySelectorAll('.langswitch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === ui)));
    document.getElementById('nbooks').textContent = t('count')(BOOKS.length);
  }

  function matches(b) {
    if (cat !== 'all' && b.category !== cat) return false;
    if (!q) return true;
    const hay = [b.title_ar, b.title_th, b.title_ms, b.author_ar, b.author_th, b.author_ms, b.slug].join(' ').toLowerCase();
    return hay.includes(q.toLowerCase());
  }

  function renderHome() {
    const list = BOOKS.filter(matches);
    const counts = id => BOOKS.filter(b => id === 'all' || b.category === id).length;
    const chips = [{ id: 'all' }, ...CATS.filter(c => counts(c.id) > 0)].map(c =>
      `<button type="button" class="chip" aria-pressed="${cat === c.id}" data-cat="${c.id}">${esc(c.id === 'all' ? t('all') : catName(c.id))}<span class="n">${counts(c.id)}</span></button>`).join('');
    const cards = list.map(b => `
      <a class="book" href="#${esc(b.slug)}">
        <div class="cover" style="--c:${COVERS[b.category] || 'var(--cover-1)'}">
          ${b.sample ? `<span class="badge">${esc(t('sample'))}</span>` : ''}
          <span class="ar" dir="rtl" lang="ar">${esc(b.title_ar)}</span>
        </div>
        <div class="meta">
          <span class="cat">${esc(catName(b.category))}</span>
          <span class="t">${esc(title(b))}</span>
          <span class="a">${esc(author(b))}</span>
        </div>
      </a>`).join('');
    view.innerHTML = `
      <div class="filters" role="group">${chips}</div>
      <p class="count">${esc(t('count')(list.length))}</p>
      ${list.length ? `<div class="grid">${cards}</div>` : `<p class="empty">${esc(t('none'))}</p>`}
      <section class="about">
        <div><h2>${esc(t('about1h'))}</h2><p>${esc(t('about1'))}</p></div>
        <div><h2>${esc(t('about2h'))}</h2><p>${esc(t('about2'))}</p></div>
        <div><h2>${esc(t('about3h'))}</h2><p>${esc(t('about3'))}</p></div>
      </section>`;
    view.querySelectorAll('.chip').forEach(el => el.onclick = () => { cat = el.dataset.cat; renderHome(); });
  }

  function renderBook(b) {
    const rl = readLang || ui;
    const s = b.summary[rl] || { html: '', toc: [] };
    const langBtn = l => `<button type="button" role="tab" id="tab-${l}" aria-selected="${rl === l}" data-l="${l}" class="${l === 'ms' ? 'jawi' : 'th'}">${esc(T[ui]['lang_' + l])}</button>`;
    const dl = l => b.pdf && b.pdf[l] ? `<a class="dl" href="${esc(b.pdf[l])}" download target="_blank" rel="noopener"><span>${esc(t('download'))}</span><small>${esc(T[ui]['lang_' + l])}</small></a>` : '';
    view.innerHTML = `
      <a class="back" href="#home">${esc(t('back'))}</a>
      <div class="reader">
        <article>
          <div class="titleblock">
            <span class="ar" dir="rtl" lang="ar">${esc(b.title_ar)}</span>
            <h1>${esc(title(b))}</h1>
            <span class="by">${esc(t('by'))}: ${esc(author(b))} · <span class="ar" dir="rtl" lang="ar">${esc(b.author_ar)}</span></span>
          </div>
          ${b.pdf && (b.pdf.th || b.pdf.ms) ? `<div class="panel dl-inline">${dl('th')}${dl('ms')}</div>` : ''}
          ${b.sample ? `<div class="notice">${esc(t('sampleNote'))}</div>` : ''}
          <div class="tabs" role="tablist" aria-label="${esc(t('read'))}">${langBtn('th')}${langBtn('ms')}</div>
          <div class="summary" lang="${rl === 'ms' ? 'ms-Arab' : 'th'}" dir="${rl === 'ms' ? 'rtl' : 'ltr'}">${s.html}</div>
        </article>
        <aside class="side">
          ${b.pdf && (b.pdf.th || b.pdf.ms) ? `<div class="panel dl-panel">${dl('th')}${dl('ms')}</div>` : ''}
          ${s.toc.length ? `<nav class="panel"><h3>${esc(t('contents'))}</h3><ul class="toc" dir="${rl === 'ms' ? 'rtl' : 'ltr'}">${s.toc.map(h => `<li><a href="#${esc(b.slug)}" data-jump="${esc(h.id)}">${esc(h.text)}</a></li>`).join('')}</ul></nav>` : ''}
          <div class="panel"><h3>${esc(t('info'))}</h3>
            <dl class="facts">
              <dt>${esc(t('category'))}</dt><dd>${esc(catName(b.category))}</dd>
              <dt>${esc(t('summarizer'))}</dt><dd>${esc(ui === 'ms' ? b.summarizer_ms : b.summarizer_th)}</dd>
              <dt>${esc(t('added'))}</dt><dd style="font-variant-numeric:tabular-nums">${esc(b.added)}</dd>
            </dl>
          </div>
        </aside>
      </div>`;
    view.querySelectorAll('.tabs button').forEach(el => el.onclick = () => { readLang = el.dataset.l; renderBook(b); });
    view.querySelectorAll('[data-jump]').forEach(el => el.onclick = e => { e.preventDefault(); const h = document.getElementById(el.dataset.jump); if (h) h.scrollIntoView({ behavior: 'smooth' }); });
  }

  const view = document.getElementById('view');
  function route() {
    const slug = location.hash.slice(1);
    const b = BOOKS.find(x => x.slug === slug);
    if (b) { renderBook(b); window.scrollTo(0, 0); } else { readLang = null; renderHome(); }
  }
  document.querySelectorAll('.langswitch button').forEach(el => el.onclick = () => { ui = el.dataset.lang; readLang = null; store.set('khulasah-ui', ui); applyUI(); route(); });
  document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim(); if (location.hash.slice(1) && BOOKS.some(b => b.slug === location.hash.slice(1))) location.hash = 'home'; else renderHome(); });
  window.addEventListener('hashchange', route);
  applyUI(); route();
})();
</script>
