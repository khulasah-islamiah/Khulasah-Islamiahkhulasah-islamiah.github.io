  let ui = store.get('khulasah-ui') === 'ms' ? 'ms' : 'th';
  let cat = 'all', q = '', readLang = null;

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const t = k => T[ui][k];
  const catName = id => (CATS.find(c => c.id === id) || {})[ui] || id;
  const L = (b, k) => (ui === 'ms' ? b[k + '_ms'] : b[k + '_th']) || b[k + '_th'] || '';
  const view = document.getElementById('view');

  function cover(b, opts = {}) {
    const badge = opts.badge === false ? '' : `<span class="badge">${esc(catName(b.category))}</span>`;
    const sample = b.sample ? `<span class="sample">${esc(t('sample'))}</span>` : '';
    if (b.cover) return `<div class="cover"><img class="photo" src="${esc(b.cover)}" alt="${esc(b.title_ar)}" loading="lazy">${sample}${badge}</div>`;
    return `<div class="cover gen" style="--c:${COVERS[b.category] || 'var(--cover-a)'}">
      <span class="ar" dir="rtl" lang="ar">${esc(b.title_ar)}</span>
      <span class="rule"></span>
      <span><span class="tt${ui === 'ms' ? ' jawi' : ''}">${esc(L(b, 'title'))}</span><br><span class="by">${esc(L(b, 'author'))}</span></span>
      <span class="seal"><img src="assets/logo-mark.png" alt=""></span>${sample}${badge}</div>`;
  }
  const card = b => `<a class="card" href="#${esc(b.slug)}">${cover(b)}<span class="t">${esc(L(b, 'title'))}</span><span class="a">${esc(L(b, 'author'))}</span></a>`;

  function matches(b) {
    if (cat !== 'all' && b.category !== cat) return false;
    if (!q) return true;
    return [b.title_ar, b.title_th, b.title_ms, b.author_ar, b.author_th, b.author_ms, b.slug].join(' ').toLowerCase().includes(q.toLowerCase());
  }
  function chips() {
    const n = id => BOOKS.filter(b => id === 'all' || b.category === id).length;
    return `<div class="filters" role="group">${[{ id: 'all' }, ...CATS.filter(c => n(c.id))].map(c =>
      `<button type="button" class="chip" aria-pressed="${cat === c.id}" data-cat="${c.id}">${esc(c.id === 'all' ? t('all') : catName(c.id))}<span class="n">${n(c.id)}</span></button>`).join('')}</div>`;
  }
  function bindChips(rerender) { view.querySelectorAll('.chip').forEach(el => el.onclick = () => { cat = el.dataset.cat; rerender(); }); }
  function bindSearch() {
    const input = document.getElementById('q');
    if (input) input.addEventListener('input', e => { q = e.target.value.trim(); if (location.hash !== '#books') location.hash = 'books'; else drawBookList(); });
  }

  function renderHome() {
    view.innerHTML = `<div class="wrap">
      <section class="hero">
        <img src="assets/logo.png" alt="Khulasah Islamiah">
        <div><h1>${esc(t('heroTitle'))}</h1><p>${esc(t('heroText'))}</p>
          <div class="search"><input id="q" type="search" autocomplete="off" placeholder="${esc(t('search'))}" value="${esc(q)}"></div></div>
      </section>
      ${chips()}
      <div class="section-head"><h2>${esc(t('latest'))}</h2><a href="#books">${esc(t('seeAll'))} ›</a></div>
      <div class="grid">${BOOKS.filter(matches).slice(0, 8).map(card).join('')}</div>
    </div>`;
    bindChips(() => { location.hash = 'books'; });
    bindSearch();
  }

  function drawBookList() {
    const list = BOOKS.filter(matches);
    document.getElementById('list').innerHTML = list.length ? `<div class="grid">${list.map(card).join('')}</div>` : `<p class="empty">${esc(t('none'))}</p>`;
    document.getElementById('count').textContent = t('count')(list.length);
  }
  function renderBooks() {
    view.innerHTML = `<div class="wrap">
      <div class="section-head"><h2>${esc(t('allBooks'))}</h2><span id="count" class="byline"></span></div>
      <div class="search" style="margin-bottom:16px"><input id="q" type="search" autocomplete="off" placeholder="${esc(t('search'))}" value="${esc(q)}"></div>
      ${chips()}<div id="list"></div></div>`;
    bindChips(renderBooks);
    bindSearch();
    drawBookList();
    const input = document.getElementById('q'); if (q && input) { input.focus(); input.setSelectionRange(q.length, q.length); }
  }

  function renderBook(b) {
    const rl = readLang || ui;
    const s = b.summary[rl] || { html: '' };
    const langName = l => T[ui]['lang_' + l];
    const dls = b.pdf ? `<a class="dl" href="${esc(b.pdf)}" download target="_blank" rel="noopener">${esc(t('download'))} ${DL_ICON}</a><span class="dl-note">${esc(t('bothLangs'))}</span>` : '';
    const related = BOOKS.filter(x => x !== b).sort((x, y) => (y.category === b.category) - (x.category === b.category)).slice(0, 4);
    const desc = L(b, 'description');
    view.innerHTML = `<div class="wrap narrow">
      <h1 class="book-title">${esc(L(b, 'title'))}</h1>
      <p class="byline">${esc(t('bookBy'))} ${esc(L(b, 'author'))} · <span class="ar" dir="rtl" lang="ar">${esc(b.title_ar)}</span>${b.added ? ` · <span style="font-variant-numeric:tabular-nums">${esc(b.added)}</span>` : ''}</p>
      <hr class="divider">
      <div class="book-cover">${cover(b, { badge: false })}</div>
      <div class="downloads">${dls}</div>
      ${b.sample ? `<div class="notice">${esc(t('sampleNote'))}</div>` : ''}
      ${desc ? `<p class="description">${esc(desc)}</p>` : ''}
      ${L(b, 'summarizer') ? `<p class="byline" style="font-size:.95rem">${esc(t('summarizer'))}: ${esc(L(b, 'summarizer'))}</p>` : ''}
      <div class="tabs" role="tablist" aria-label="${esc(t('readIn'))}">
        ${['th', 'ms'].map(l => `<button type="button" role="tab" aria-selected="${rl === l}" data-l="${l}" class="${l === 'ms' ? 'jawi' : ''}">${esc(langName(l))}</button>`).join('')}
      </div>
      <div class="summary" lang="${rl === 'ms' ? 'ms-Arab' : 'th'}" dir="${rl === 'ms' ? 'rtl' : 'ltr'}">${s.html}</div>
      ${related.length ? `<section class="related"><div class="section-head"><h2>${esc(t('related'))}</h2></div><div class="grid">${related.map(card).join('')}</div></section>` : ''}
    </div>`;
    view.querySelectorAll('.tabs button').forEach(el => el.onclick = () => { readLang = el.dataset.l; renderBook(b); });
  }

  function renderAbout() {
    view.innerHTML = `<div class="wrap narrow about">
      <h1>${esc(t('aboutTitle'))}</h1><p>${esc(t('aboutLead'))}</p>
      <div class="about-grid">
        <div><h2>${esc(t('about1h'))}</h2><p>${esc(t('about1'))}</p></div>
        <div><h2>${esc(t('about2h'))}</h2><p>${esc(t('about2'))}</p></div>
        <div><h2>${esc(t('about3h'))}</h2><p>${esc(t('about3'))}</p></div>
      </div></div>`;
  }

  function applyUI() {
    document.documentElement.lang = ui === 'ms' ? 'ms-Arab' : 'th';
    document.documentElement.dir = ui === 'ms' ? 'rtl' : 'ltr';
    document.body.classList.toggle('ms', ui === 'ms');
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll('.langswitch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === ui)));
  }

  function route() {
    const h = location.hash.slice(1) || 'home';
    const b = BOOKS.find(x => x.slug === h);
    const section = b ? 'books' : (['books', 'about'].includes(h) ? h : 'home');
    document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === section) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (b) renderBook(b); else { readLang = null; if (h === 'books') renderBooks(); else if (h === 'about') renderAbout(); else renderHome(); }
    if (h !== 'books') window.scrollTo(0, 0);
  }

  document.querySelectorAll('.langswitch button').forEach(el => el.onclick = () => { ui = el.dataset.lang; readLang = null; store.set('khulasah-ui', ui); applyUI(); route(); });
  window.addEventListener('hashchange', route);
  applyUI(); route();
})();
</script>
